[workspace]
resolver = "2"
members = ["crates/vt_sim", "crates/vt_client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["John K"]
repository = "https://github.com/jkeywo/void-and-thunder"

[workspace.lints.clippy]
# Bevy system signatures are one inline type by design: a query is its type and
# a system's arguments are its data access. Factoring either into aliases or
# param structs only moves the noise somewhere the reader still has to chase.
# Bevy's own workspace allows both lints for the same reason.
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
# Full engine — client only.
bevy = "0.19"
# Logic-only subcrates — the simulation crate uses these (no renderer/window/audio),
# so it stays headless and unit-testable while sharing Transform with the client.
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_math = "0.19"
bevy_reflect = "0.19"
bevy_time = "0.19"
bevy_transform = "0.19"

vt_sim = { path = "crates/vt_sim" }

# Data-driven tuning. `ron` is pinned to the major already in the lock via
# bevy_asset — a different major would duplicate the crate in the build.
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# The fleet's shared batch-and-report testing shape (dev-only: the scenario
# corpus). Pinned to a rev like every vellum dependency; bumping it is a PR
# whose diff touches only manifests and lockfiles. For local work against a
# checkout, use a gitignored .cargo/config.toml [patch] — see vellum's README.
vellum-corpus = { git = "https://github.com/jkeywo/vellum", rev = "8e1037f8e7023fe2ea6988c5dcef8a21936c2a11", features = ["json"] }

# Faster iterative builds: our code lightly optimised, dependencies fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Smaller, faster wasm for the web client.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
