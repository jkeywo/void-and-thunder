# Fleet CI caller — the workflow itself lives in vellum, pinned to a rev like
# every other vellum dependency; a bump PR moves this rev together with the
# pyproject pin. Jobs: pasm validate + scan (gates), fmt / clippy -D warnings /
# tests, Trunk web build, Pages deploy on main pushes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The deploy job inside fleet-ci needs pages + id-token; a called workflow can
# only narrow what the caller grants.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet:
    uses: jkeywo/vellum/.github/workflows/fleet-ci.yml@61cf506e096854a3e05e1a19369deb0901d298d5
    with:
      # winit's Wayland backend and Bevy's audio/input need these to build on
      # ubuntu; the wasm job shares them for host-compiled build scripts.
      apt-packages: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      wasm-mode: trunk
