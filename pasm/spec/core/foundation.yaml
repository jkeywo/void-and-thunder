  - component: sound-effects
    core:
      status: implemented
      confidence: confirmed
      title: Sound Effects (cross-platform)
      summary: >-
        Procedurally-synthesised SFX for broadside/hit/explosion/board, triggered
        by the same events/state the visuals use. Two compile-time backends:
        native renders WAV buffers played via Bevy AudioPlayer; wasm disables
        Bevy audio and calls a WebAudio shim in index.html (window.vtPlaySound)
