entities:
  - system: void-and-thunder-simulation
    core:
      status: implemented
      confidence: confirmed
      title: Void & Thunder Simulation
      summary: >-
        Renderer-agnostic, fixed-step ship simulation for space piracy in the
        Settled Dark. Built on Bevy ECS (logic-only subcrates), so it runs
        headless in tests. Owns all game rules; the client owns none.
      references: [ship-movement, ship-combat, sim-plugin]
    implementation:
      status: declared
      paths: [crates/vt_sim/src]
      symbols: [SimPlugin, SimSet, wrap_angle, lcg_next]
      tests: [crates/vt_sim/src/ship.rs, crates/vt_sim/src/combat.rs]

  - component: test-harness
    core:
      status: implemented
      confidence: confirmed
      title: Headless Test Harness
      summary: >-
        Ships are one uniform entity shape (base hull + full ShipLoadout +
        PilotIntent); a player ship and an AI ship differ only in which system
        writes their intent (the client for a Player, ai_system for an
        AiController). Harness builds a deterministic headless World + step
        schedule mirroring SimSet order, so automated tests can AI-pilot a
        player-shaped ship (Protagonist + AiController) and step the sim.
      references: [void-and-thunder-simulation, enemy-ai, client-shell]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/harness.rs, crates/vt_sim/src/spawn.rs]
      symbols: [Harness, ShipLoadout, ship_bundle]
      tests: [crates/vt_sim/src/harness.rs]

  - component: ship-movement
    core:
      status: implemented
      confidence: confirmed
      title: Ship Movement
      summary: >-
        Arcade helm physics — the throttle/turn intent in Helm rotates the hull,
        thrusts along the bow, applies drag and clamps to a sail-set top speed,
        then integrates position. Pure maths in helm_step; the ECS system wraps
        it. Heading is the source of truth and is written into Transform.
      references: [ship-combat]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/ship.rs, crates/vt_sim/src/components.rs]
      symbols: [helm_step, movement_system, ShipStats, Helm, Heading, Velocity]
      tests: [crates/vt_sim/src/ship.rs]

  - component: ship-combat
    core:
      status: implemented
      confidence: confirmed
      title: Ship Combat
      summary: >-
        Aimed broadsides. FireOrders is a *request* consumed by weapons_system
        (hold-to-aim / release-to-fire); the player's aim direction is clamped to
        the beam ± Broadside.arc by broadside_direction (None = the beam, used by
        the AI). A fire request begins a charge_time wind-up along the captured
        direction, then fires — 0 for the player, ~0.5s telegraphed for enemies.
        broadside_volley spreads shots along the hull, each inheriting ship
        momentum; projectiles fly, expire on a TTL, and on overlap damage
        hostile-faction hulls (reduced while bracing); dead hulls despawn.
      references: [ship-movement]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/combat.rs, crates/vt_sim/src/components.rs]
      symbols:
        [
          broadside_volley,
          broadside_direction,
          circles_overlap,
          spheres_overlap,
          braced_damage,
          weapons_system,
          projectile_system,
          collision_system,
          destruction_system,
          Broadside,
          Projectile,
          Hull,
          Faction,
        ]
      tests: [crates/vt_sim/src/combat.rs]

  - component: sim-plugin
    core:
      status: implemented
      confidence: confirmed
      title: Simulation Plugin
      summary: >-
        Wires every sim system into FixedUpdate in a fixed order
        (Movement -> Weapons -> Resolution) via SimSet, so ship physics is
        deterministic and independent of render framerate.
      references: [ship-movement, ship-combat]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/plugin.rs]
      symbols: [SimPlugin, SimSet]

  - component: piracy-finisher
    core:
      status: implemented
      confidence: confirmed
      title: Piracy Finisher — Brace & Board
      summary: >-
        Brace (a ship's Brace.active) cuts incoming damage by BRACE_DAMAGE_FACTOR
        in collision_system. cripple_system marks enemies below CRIPPLE_THRESHOLD
        hull as Disabled — they stop steering/firing (AI skips Disabled) and
        drift; boarding_system loots the nearest Disabled ship within BOARD_RANGE
        of the Protagonist when BoardIntent is raised, tallying Plunder. Runs in
        SimSet::Piracy after Resolution.
      references: [ship-combat, enemy-ai, spawn-director]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/piracy.rs, crates/vt_sim/src/components.rs]
      symbols:
        [
          cripple_system,
          boarding_system,
          Plunder,
          BoardIntent,
          Brace,
          Disabled,
          CRIPPLE_THRESHOLD,
          BOARD_RANGE,
        ]
      tests: [crates/vt_sim/src/piracy.rs]

  - component: ship-drives
    core:
      status: implemented
      confidence: confirmed
      title: Ship Drives & Time Dilation
      summary: >-
        Per-ship SpeedScale (= EMP x boost) recomputed each step and applied by
        movement_system. EmpDefense is the EMP bar that inverse-lerps speed and
        recovers; BoostDrive is a rechargeable speed overdrive; MicrowarpDrive is
        a short-range aimed teleport (clamp_to_range, cooldown-gated). Aiming any
        weapon dilates global time to 25% via the client's AimBattery easing
        Time<Virtual> (bullet-time), spent in real seconds so the sim slows while
        input/camera stay live. All tuning is per-ship.
      references: [ship-movement, emp-weapon]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/drive.rs, crates/vt_sim/src/components.rs]
      symbols:
        [
          speed_scale,
          speed_scale_system,
          battery_system,
          microwarp_system,
          clamp_to_range,
          SpeedScale,
          EmpDefense,
          BoostDrive,
          MicrowarpDrive,
        ]
      tests: [crates/vt_sim/src/drive.rs]

  - component: bullet-time
    core:
      status: implemented
      confidence: confirmed
      title: Bullet-Time (Aim Battery)
      summary: >-
        Aiming a weapon dilates global time toward AIM_TIMESCALE while a
        rechargeable AimBattery has charge, then eases back. Charge is spent in
        real seconds (Time<Real>) so the window is a real ~5s regardless of the
        dilation; aim_time_dilation sets Time<Virtual>'s relative speed.
      references: [ship-drives]
    implementation:
      status: declared
      paths: [crates/vt_client/src/bullet_time.rs]
      symbols: [AimBattery, aim_time_dilation]

  - component: emp-weapon
    core:
      status: implemented
      confidence: confirmed
      title: EMP Emitter
      summary: >-
        Frontal auto-tracking weapon (player-only). While held, emp_system picks
        the hostile nearest the aim cursor within range and arc, swivels the
        emitter toward its lead (rate-limited, arc-clamped) and fires EmpBolts on
        cooldown; emp_bolt_system applies 25% of the target's EMP resist per hit.
      references: [ship-drives, ship-combat]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/emp.rs]
      symbols:
        [emp_system, emp_bolt_system, lead_angle, swivel_toward, EmpWeapon, EmpBolt]
      tests: [crates/vt_sim/src/emp.rs]

  - component: torpedoes
    core:
      status: implemented
      confidence: confirmed
      title: Homing Torpedoes
      summary: >-
        A reloading magazine (player-only). Holding aim locks the hostile nearest
        the cursor and accrues launch count (1 + 1 per 0.5s, capped by loaded
        tubes / 10) in TorpedoLock; release hands the locked targets to a
        TorpedoLaunchQueue, independently drained by torpedo_launch_system one
        tube at a time (alternating top/bottom, arcing back to the plane) —
        separate from the aim/lock lifecycle since a volley can still be
        launching while a fresh aim starts. torpedo_homing_system steers them,
        torpedo_hit_system applies hull damage, tubes reload one at a time.
      references: [ship-combat]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/torpedo.rs]
      symbols:
        [
          torpedo_lock_system,
          torpedo_launch_system,
