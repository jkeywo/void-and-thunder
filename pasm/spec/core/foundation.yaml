  # ---- Proposed: data-driven tuning, scenarios and the design panel ----

  - component: data-tuning
    core:
      status: partially-implemented
      confidence: confirmed
      title: Data-Driven Tuning (RON + hot reload)
      summary: >-
        Gameplay numbers move out of Rust consts into RON under
        crates/vt_client/assets/data/. SimTuning holds the sim's rules
        (damage/TTL/ranges/AI gains) and FeelTuning the client's feel
        (bullet-time, screen shake, trails, camera). vt_sim owns the types and
        derives Serialize/Deserialize/Reflect but stays asset-free; vt_client
        owns the AssetLoaders and copies each loaded asset into the plain
        Resource the sim reads. Default impls remain the fallback, so the
        headless Harness needs no asset plumbing and shipped RON is asserted
        equal to Default in tests.

        Landed so far: SimTuning and its RON file, loaded and hot-reloaded.
        FeelTuning (the client's camera/juice/trail constants) is still to come.
      references: [void-and-thunder-simulation, test-harness, game-feel, bullet-time]
    implementation:
      status: declared
      paths:
        [
          crates/vt_sim/src/tuning.rs,
          crates/vt_client/src/data/mod.rs,
          crates/vt_client/assets/data/sim.tuning.ron,
        ]
      symbols:
        [
          SimTuning,
          AiTuning,
          DataPlugin,
          DataHandles,
          RonAssetLoader,
          SimTuningAsset,
          RonLoadError,
        ]
      tests: [crates/vt_sim/src/tuning.rs, crates/vt_client/src/data/mod.rs]

  - component: scenarios
    core:
      status: implemented
      confidence: confirmed
      title: Ship Classes & Scenarios
      summary: >-
        Ships become instances of named classes (ShipTable + a ClassId
        component) rather than hand-written struct literals, and encounters
        become authored Scenario files — player placement, pre-placed enemies
        with ShipFlags (invulnerable / inert / anchored), and optional
        DirectorSettings. A scenario with no director settings suppresses waves
        entirely, which is what the Test Range uses: one stationary,
        non-attacking, invulnerable target. Loading is a new GameState that
        gates spawning on the assets being ready.
      references: [spawn-director, session-lifecycle, data-tuning, piracy-finisher]
    implementation:
