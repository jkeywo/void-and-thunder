      tests: [crates/vt_sim/src/point_defense.rs]

  - component: fire-barrels
    core:
      status: implemented
      confidence: confirmed
      title: Fire Barrels
      summary: >-
        The unaimed option in the special slot: burning barrels rolled off the
        stern to deny the lane behind you. PilotIntent.barrel_drop is a level,
        not an edge. FireBarrelRack owns the cadence through its own cooldown, so
        edge detection stays in the client. A dropped FireBarrel burns
        overlapping hostiles through apply_hull_damage, so brace, shields and
        invulnerability behave exactly as they do against shot, and announces a
        ShipHit only every HIT_REPORT_INTERVAL rather than every step. Finite and
        restocked by boarding, like torpedoes.
      references: [ship-combat, piracy-finisher, loadout-selection]
    implementation:
      status: declared
