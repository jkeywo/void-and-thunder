entities:
  - system: void-and-thunder-simulation
    core:
      status: implemented
      confidence: confirmed
      title: Void & Thunder Simulation
      summary: >-
        Renderer-agnostic, fixed-step ship simulation for space piracy in the
        Settled Dark. Built on Bevy ECS (logic-only subcrates), so it runs
        headless in tests. Owns all game rules; the client owns none.
      references: [ship-movement, ship-combat, sim-plugin]
    implementation:
      status: declared
      paths: [crates/vt_sim/src]
      symbols: [SimPlugin, SimSet, wrap_angle, lcg_next]
      tests: [crates/vt_sim/src/ship.rs, crates/vt_sim/src/combat.rs]

  - component: test-harness
    core:
      status: implemented
      confidence: confirmed
      title: Headless Test Harness
      summary: >-
        Ships are one uniform entity shape: the base hull from ship_bundle plus
        whatever devices the ShipLoadout fits, plus a PilotIntent. A player ship
        and an AI ship differ only in which system writes their intent (the
        client for a Player, ai_system for an AiController). The kit itself is
        not uniform any more, and no system may assume it is: see
        loadout-selection. Harness builds a deterministic headless World + step
        schedule mirroring SimSet order, so automated tests can AI-pilot a
        player-shaped ship (Protagonist + AiController) and step the sim.
      references: [void-and-thunder-simulation, enemy-ai, client-shell]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/harness.rs, crates/vt_sim/src/spawn.rs]
      symbols: [Harness, ShipLoadout, ship_bundle, spawn_ship_in]
      tests: [crates/vt_sim/src/harness.rs]

  - component: ship-movement
    core:
      status: implemented
      confidence: confirmed
      title: Ship Movement
      summary: >-
        Arcade helm physics with a Black-Flag speed-versus-agility bargain. The
        Helm asks for a rate of turn scaled by agility_at — best at rest, worst
        at top speed — and the hull eases onto it at turn_accel, so it has
        rotational inertia rather than snapping. Thrust pushes along the bow;
        drag is anisotropic (low forward_drag so the ship carries its way, high
        lateral_drag so it bites sideways instead of skidding), then velocity is
        clamped to a sail-set top speed and position integrated. Pure maths in
        helm_step; the ECS system wraps it. Heading is the source of truth and is
        written into Transform. Taking in sail is the core manoeuvre: at full
        sail the corsair sloop needs ~8s and 623 units to come about, at all stop
        ~3s and pivots on the spot.
      references: [ship-combat, hull-contact]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/ship.rs, crates/vt_sim/src/components.rs]
      symbols:
        [
          helm_step,
          agility_at,
          movement_system,
          ShipStats,
          Helm,
          Heading,
          Velocity,
          AngularVelocity,
        ]
      tests: [crates/vt_sim/src/ship.rs]

  - component: hull-contact
    core:
      status: implemented
      confidence: confirmed
      title: Hull Contact — Shoving and Ramming
      summary: >-
        Ships are solid. ram_system resolves every overlapping pair once per step
        in SimSet::Contact, between Movement and Bounds: it eases the pair apart
        (ram_separation), exchanges momentum along the contact normal with
        ram_restitution, and above ram_damage_threshold hurts *both* hulls in
        proportion to closing speed via apply_hull_damage. Anchored hulls absorb
        the shove without moving. Each contact emits ShipHit, so the client's
        existing trauma/kick/hitstop/spark chain fires for a ram without knowing
        rams exist.
      references: [ship-movement, ship-combat]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/collide.rs]
      symbols: [ram_system, ram_damage]
      tests: [crates/vt_sim/src/collide.rs, crates/vt_sim/src/harness.rs]

  - component: directional-shields
    core:
      status: implemented
      confidence: confirmed
      title: Directional Shields
      summary: >-
        Two independent 180-degree banks — everything forward of the beam, and
        everything abaft it — that soak damage before the hull. shield_arc picks
        the bank from where a blow landed relative to the bow, so facing decides
        which pool pays. Any contact suppresses that bank's regeneration for
        regen_delay, which is what makes a shield a resource rather than a flat
        damage discount: under sustained fire the struck side stays flat and the
        answer is to turn and present the other. A max of zero means no shields
        fitted, so a class opts in with one authored number in ships.ron; the
        player's sloop carries them and house_patrol does not. Resolution runs
        inside apply_hull_damage — invulnerability, then brace, then shield, then
        hull — and reports the split as a DamageReport so the client can flare a
        turned shot differently from a breach.
      references: [ship-combat, piracy-finisher]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/shield.rs]
      symbols:
        [
          Shield,
          ShieldArc,
          ShieldBank,
          DamageReport,
          shield_arc,
          shield_regen_system,
          shield_refit_system,
        ]
      tests: [crates/vt_sim/src/shield.rs, crates/vt_sim/src/harness.rs]

  - component: ship-combat
    core:
      status: implemented
      confidence: confirmed
      title: Ship Combat
      summary: >-
        Aimed broadsides. FireOrders is a *request* consumed by weapons_system
        (hold-to-aim / release-to-fire); the player's aim direction is clamped to
        the beam ± Broadside.arc by broadside_direction (None = the beam, used by
        the AI). A fire request begins a charge_time wind-up along the captured
        direction, then fires — 0 for the player, ~0.5s telegraphed for enemies.
        broadside_volley spreads shots along the hull, each inheriting ship
        momentum; projectiles fly, expire on a TTL, and on overlap damage
        hostile-faction hulls; dead hulls despawn. apply_hull_damage is the one
        place a hull goes down — invulnerability, brace mitigation and the struck
        shield arc all compose there, in that order, and it returns how the blow
        split between shield and hull.
      references: [ship-movement, directional-shields]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/combat.rs, crates/vt_sim/src/components.rs]
      symbols:
        [
          broadside_volley,
          broadside_direction,
          circles_overlap,
          spheres_overlap,
          braced_damage,
          weapons_system,
          projectile_system,
          collision_system,
          destruction_system,
          Broadside,
          Projectile,
          Hull,
          Faction,
        ]
      tests: [crates/vt_sim/src/combat.rs]

  - component: sim-plugin
    core:
      status: implemented
      confidence: confirmed
      title: Simulation Plugin
      summary: >-
        Wires every sim system into FixedUpdate in a fixed order
        (Movement -> Weapons -> Resolution) via SimSet, so ship physics is
        deterministic and independent of render framerate.
      references: [ship-movement, ship-combat]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/plugin.rs]
      symbols: [SimPlugin, SimSet]

  - component: piracy-finisher
    core:
      status: implemented
      confidence: confirmed
      title: Piracy Finisher — Brace & Board
      summary: >-
        Brace (a ship's Brace.active) cuts incoming damage by BRACE_DAMAGE_FACTOR
        in collision_system. cripple_system marks enemies below CRIPPLE_THRESHOLD
        hull as Disabled — they stop steering/firing (AI skips Disabled) and
        drift; boarding_system loots the nearest Disabled ship within BOARD_RANGE
        of the Protagonist when BoardIntent is raised, tallying Plunder and
        repairing BOARD_REPAIR_FRAC of the protagonist's maximum hull — the only
        way to recover hull, which makes piracy the sustain mechanic rather than
        only the scoring one. Runs in SimSet::Piracy after Resolution.
      references: [ship-combat, enemy-ai, spawn-director]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/piracy.rs, crates/vt_sim/src/components.rs]
      symbols:
        [
          cripple_system,
          boarding_system,
          Plunder,
          BoardIntent,
          Brace,
          Disabled,
          CRIPPLE_THRESHOLD,
          BOARD_RANGE,
        ]
      tests: [crates/vt_sim/src/piracy.rs]

  - component: ship-drives
    core:
      status: implemented
      confidence: confirmed
      title: Ship Drives & Time Dilation
      summary: >-
        Per-ship SpeedScale (= EMP x boost) recomputed each step and applied by
        movement_system. EmpDefense is the EMP bar that inverse-lerps speed and
        recovers; BoostDrive is a speed overdrive drawing on the shared Battery
        (see battery-power); MicrowarpDrive is a short-range aimed teleport
        (clamp_to_range, cooldown-gated). Aiming any weapon dilates global time
        to 25% via the client's AimBattery easing Time<Virtual> (bullet-time),
        spent in real seconds so the sim slows while input/camera stay live. All
        tuning is per-ship.
      references: [ship-movement, emp-weapon, battery-power]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/drive.rs, crates/vt_sim/src/components.rs]
      symbols:
        [
          speed_scale,
          speed_scale_system,
          emp_recovery_system,
          microwarp_system,
          clamp_to_range,
          SpeedScale,
          EmpDefense,
          BoostDrive,
          MicrowarpDrive,
        ]
      tests: [crates/vt_sim/src/drive.rs]

  - component: battery-power
    core:
      status: implemented
      confidence: confirmed
      title: The Battery Slot
      summary: >-
        One Battery per ship, shared by whichever device occupies the battery
        loadout slot: BoostDrive, the EmpWeapon disruptor, or PointDefense.
        battery_draw_system is the only place charge is spent. It walks the
        fitted devices in a fixed order (boost, disruptor, screen), debits
        drain_per_sec x dt while the pilot holds the slot key, and sets each
        device's engaged/powered flag. battery_recharge_system tops the pool up
        only in a step where nothing drew, so holding a device costs its full
        drain rather than the difference between drain and recharge. A device on
        a hull with no Battery is never powered.
      references: [ship-drives, emp-weapon, point-defense, loadout-selection]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/drive.rs]
      symbols: [Battery, battery_draw_system, battery_recharge_system]
      tests: [crates/vt_sim/src/drive.rs]

  - component: point-defense
    core:
      status: implemented
      confidence: confirmed
      title: Point Defence Screen
      summary: >-
        The defensive option in the battery slot. While powered, the emitter
        destroys the nearest hostile munition inside its radius at most once per
        1/rate seconds: cannon shot, EMP bolts and torpedoes alike, because a
        screen that stops only one of the three cannot be reasoned about
        mid-fight. Torpedoes fly off the plane, so the radius test uses the
        flattened XY position while the MunitionIntercepted message carries the
        true 3D point for the client's tracer: draw_intercept_flashes snaps a
        fading line from the emitter to each kill, without which the device is
        invisible and shots merely stop arriving. Runs last in SimSet::Weapons,
        so it only ever takes what is still in the air.
      references: [battery-power, ship-combat, torpedoes]
    implementation:
      status: declared
      paths:
