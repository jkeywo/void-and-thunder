  - component: loadout-selection
    core:
      status: implemented
      confidence: confirmed
      title: Loadout Slots
      summary: >-
        The player's ship is a fit, not a fixed kit. ShipLoadout's device fields
        are optional, and "not fitted" means the component is never inserted, so
        the system that services it never sees the ship: the slots live in the
        archetype rather than in enabled flags. Three slots, one option each.
        Broadside (long nines or carronades), battery (boost, disruptor or point
        defence) and special (torpedoes, microwarp or fire barrels), authored in
        loadouts.ron. SelectedLoadout holds the choice; LoadoutCatalogue::fit
        lays it over the class's own loadout at spawn. One key per slot, resolved
        against what the ship carries rather than naming a device. The choice
        persists through vellum_save in its own slot beside the career: a
        preference, not a reward, and clamped on load because the save holds
        indices that can outlive the list they point into.
      references:
        [spawn-director, battery-power, point-defense, fire-barrels, hud-bridge]
    implementation:
      status: declared
      paths:
        [
          crates/vt_sim/src/spawn.rs,
          crates/vt_client/src/data/loadouts.rs,
          crates/vt_client/src/input.rs,
          crates/vt_client/src/progress.rs,
        ]
      symbols:
        [
          ShipLoadout,
          fit_devices,
          spawn_ship,
          spawn_ship_in,
          LoadoutCatalogue,
          SelectedLoadout,
        ]
      tests:
        [crates/vt_sim/src/spawn.rs, crates/vt_client/src/data/loadouts.rs]

  - component: hud-action-channel
    core:
      status: implemented
      confidence: confirmed
      title: HUD Action Channel
      summary: >-
        The HUD's controls talk back. bridge.js queues game.send(action, payload)
        calls; the host drains the queue once a frame, Ultralight through
        evaluate_script of window.__drainActions and wasm through
        window.vtHudDrainActions, and parse_hud_action reads one line of
        "action|key=value" into a HudAction. Deliberately not JSON: the host
        hand-builds its own JSON and carries no parser, and a line of text is the
        one part of the channel testable without a browser. On native,
        forward_input fires Ultralight mouse events (move before down, so hit
        testing settles) at logical cursor coordinates the view's device scale
        makes equal to page CSS pixels; resize_hud keeps view, texture and
        coordinates in step with the window. Hit-testing stops at the chips, so
        the card stays click-through and the canvas still gets gameplay clicks.
      references: [hud-bridge, loadout-selection]
    implementation:
      status: declared
      paths:
