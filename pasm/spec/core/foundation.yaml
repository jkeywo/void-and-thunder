  # ---- Proposed for the MVP (see docs/mvp-plan.md) ----

  - component: enemy-ai
    core:
      status: implemented
      confidence: confirmed
      title: Enemy Ship AI
      summary: >-
        A controller that writes Helm/FireOrders for AiController ships: flee when
        the hull is low, pursue a distant target bow-on, otherwise present a beam
        and fire (pure fn desired_helm). When AiController.use_abilities is set the
        pilot also drives the kit via PilotIntent (ai_abilities_system/
        decide_abilities): microwarp when surrounded, EMP a hostile in range,
        board the nearest crippled ship when none is near, else torpedo a distant
        one. Enemies leave use_abilities off; the player-AI toggle turns it on.
      references: [ship-movement, ship-combat, test-harness]
    implementation:
      status: declared
      paths: [crates/vt_sim/src/ai.rs, crates/vt_sim/src/components.rs]
      symbols:
        [desired_helm, ai_system, ai_abilities_system, decide_abilities, AiController]
      tests: [crates/vt_sim/src/ai.rs]

  - component: spawn-director
    core:
      status: implemented
      confidence: confirmed
      title: Spawn Director & Encounter State
      summary: >-
        director_system sends escalating waves (wave_size) of hostile ships from
        a ring near the system edge (wave_spawn_points) at the Protagonist; the
        next wave arrives when the current is cleared. Encounter tracks wave,
        enemies_remaining and Outcome (InProgress/Cleared/PlayerDestroyed). The
        client maps Outcome to a Playing/GameOver state with an R-to-restart
        (reset_encounter) and a HUD line. ship_bundle is the one ship constructor.
      references: [enemy-ai, star-system]
    implementation:
      status: declared
