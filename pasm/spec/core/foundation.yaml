      tests: [crates/vt_sim/src/torpedo.rs]

  - component: game-feel
    core:
      status: implemented
      confidence: confirmed
      title: Game Feel & Camera
      summary: >-
        The sim announces ShipHit/ShipDestroyed messages; the client turns them
        into hit sparks, expanding explosions and screen shake (CameraRig
        trauma), plus muzzle flashes on new cannonballs. Effects scale-and-fade
        via the Effect component. The orbit camera (camera_orbit) follows the
        player, snapping to the active aim mode or free-looking otherwise.
        Off-screen enemies are called out by pooled UI markers pinned to the
        window edge in their on-screen direction (update_offscreen_markers).
      references: [ship-combat, spawn-director, client-shell]
    implementation:
      status: declared
      paths:
        [
          crates/vt_sim/src/events.rs,
          crates/vt_client/src/camera.rs,
