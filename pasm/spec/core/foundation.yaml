  - component: dev-panel
    core:
      status: implemented
      confidence: confirmed
      title: Design Panel (in-game tuning UI)
      summary: >-
        An egui panel, behind the non-default dev-panel feature, that walks the
        tuning structs with bevy_reflect and renders every field as a paired
        slider and text box. A static FieldSpec table supplies the min/max and
        marks which fields are authored config versus live state, so a re-apply
        pass can push class edits onto live entities without clobbering reload
        timers. Edits apply instantly; an explicit Save writes the RON back.
        A DevPanelFocus resource gates game input while the panel has the
        pointer or keyboard.
      references: [data-tuning, scenarios, controller-input]
