  - component: hud-bridge
    core:
      status: implemented
      confidence: confirmed
      title: HUD Bridge (canonical HUD)
      summary: >-
        gather_hud_state reads the player ship plus encounter/session state
        each frame into a JSON snapshot (coords, hull, boost, per-weapon
        cooldowns, torpedo tubes + lock count, bullet-time charge, wave/
        enemies/plunder, pause/AI-pilot/boarding, input method, outcome, and
        the controls-panel toggle) consumed by the self-contained hud.html via
        window.updateHud. Two transports: wasm injects hud.html's style+body
        into a same-document overlay div; native (native-html-hud feature,
        default-on) renders it off-screen with Ultralight into a Bevy texture.
        This superseded the old Bevy-Text HUD and aim-battery gauge, which are
        deleted.
      references: [ship-combat, ship-drives, bullet-time, spawn-director, piracy-finisher, controller-input]
