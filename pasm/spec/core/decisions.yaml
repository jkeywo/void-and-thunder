entities:
  - decision: sim-on-bevy-ecs
    core:
      status: accepted
      confidence: confirmed
      title: The simulation is structured on Bevy ECS, not plain Rust
      summary: >-
        vt_sim depends on the logic-only Bevy subcrates (bevy_ecs, bevy_app,
        bevy_math, bevy_time, bevy_transform) and models ships as ECS entities
        with a SimPlugin, rather than a hand-rolled struct-of-arrays sim.
      rationale:
        - >-
          Keeps one authoring model (ECS) across sim and client, and lets sim
          and renderer share Transform directly.
        - >-
          Still compiles fast and runs headless because no render, window or
          audio crates are pulled in.
        - >-
          Pure gameplay maths (helm_step, broadside_volley) stays in free
          functions so it is unit-testable without a World.
      references: [void-and-thunder-simulation, sim-plugin]

  - decision: fixed-update-sim
    core:
      status: accepted
      confidence: confirmed
      title: All sim systems run in FixedUpdate
      summary: Movement/weapons/resolution run at a fixed timestep, ordered by SimSet.
      rationale:
        - Deterministic ship physics independent of render framerate.
        - A precondition for replays and for fair, repeatable combat tuning.
      references: [sim-plugin]

  - decision: web-deploy-via-trunk-pages
    core:
      status: accepted
      confidence: confirmed
      title: Web client ships via Trunk to GitHub Pages on push to main
      summary: >-
        trunk build --release --public-url /void-and-thunder/ in CI, published
        with the official actions/deploy-pages flow.
      rationale:
        - Trunk is the standard Bevy/wasm bundler.
        - >-
          public-url matches the repo subpath so assets resolve on
          <user>.github.io/void-and-thunder/.
      references: [client-shell]

  - decision: setting-vendored
    core:
      status: accepted
      confidence: confirmed
      title: The Settled Dark setting is vendored read-only into the repo
      summary: >-
        design/setting/settled_dark/ holds a copy of the shared worldspec
        package, with SOURCE.md recording where canon lives.
      rationale:
        - >-
          The game must build and deploy self-contained; CI has no access to the
          AnalogueGames worldspec tree.
        - >-
          Canon still lives upstream; this is a read-only snapshot the game reads
          for flavour and naming.
      references: [ship-combat]

  - decision: tuning-in-ron-loaded-by-client
    core:
      status: accepted
      confidence: confirmed
      title: Tuning lives in RON; the client loads it, the sim just reads a Resource
      summary: >-
        vt_sim owns the tuning types and derives Serialize/Deserialize/Reflect,
        but gains no bevy_asset dependency. vt_client owns the AssetLoaders and
        copies each loaded asset into a plain Resource the sim systems read.
      rationale:
        - >-
          Keeps vt_sim headless and asset-free — Harness::new() builds a bare
          World + Schedule with no plugins, and would need an AssetServer (or a
          second, divergent construction path) if the sim loaded its own files.
        - >-
          Mirror DTO structs in the client were rejected: they drift from the
          real components, and ship_bundle's "exactly one way to make a ship"
          invariant would quietly gain a second definition.
        - >-
          Default impls stay as the fallback, so every existing test keeps
          passing and a missing or partial file degrades instead of failing.
      references: [data-tuning, test-harness]

  - decision: hot-reload-breaks-replay-determinism
    core:
      status: accepted
      confidence: confirmed
      title: Hot-reloading tuning mid-run forfeits the determinism fixed-update buys
      summary: >-
        Changing tuning while the sim is running makes that run
        non-reproducible, since the same inputs no longer imply the same state.
      rationale:
        - >-
          fixed-update-sim is justified partly as a precondition for replays;
          this is the explicit exception to it.
        - >-
          Accepted because the design panel is a development tool behind a
          non-default feature, never present in a shipped build, and the
          iteration speed is worth more than replayable tuning sessions.
        - >-
          A recorded run must therefore capture the tuning it ran under, not
          just the inputs.
      references: [fixed-update-sim, dev-panel, data-tuning]

  - decision: dev-panel-behind-a-feature
    core:
      status: accepted
      confidence: confirmed
      title: The design panel is bevy_egui behind a non-default feature; data loading is not
      summary: >-
        Only the panel UI is gated by the dev-panel feature. RON loading, the
        tuning resources, scenarios and the sim markers are unconditional.
      rationale:
        - >-
          A release build must still read its tuned RON; gating the loading too
          would mean the shipped game silently ran on Default values.
        - >-
          bevy_egui gives sliders, text entry and its own input handling for
          free, where bevy_ui would need all three hand-built, and routing the
          panel through the HTML HUD would first require building the HUD's
          missing input channel.
        - >-
          egui captures the pointer when hovered, so game input systems must
          respect a DevPanelFocus run condition or dragging a slider also aims
          and fires.
      references: [dev-panel, hud-bridge, controller-input]

  - decision: scenario-corpus-on-vellum-corpus
    core:
      status: accepted
      confidence: confirmed
      title: The scenario corpus runs on vellum-corpus, and this repo drives that crate
      summary: >-
        The authored scenarios are proven playable by driving them headlessly —
        an AI-piloted player ship (uniform entity shape) through the Harness,
        one case per scenario per director seed — with the batch/report
        machinery consumed from vellum-corpus as a dev-dependency pinned by
        rev. Records, expectations and outcome vocabulary stay in this repo.
      rationale:
        - >-
          The fleet rule is that every new shared crate lands with a driving
          consumer, and this repo is the designated one for the testing,
          profiling and composition crates: small, active, and with all three
          needs on its roadmap. The corpus API was designed against this
          game's scenarios, not extracted speculation.
        - >-
          The corpus measures rather than flatters: its first report showed
          the AI-piloted player losing the Skirmish's opening wave on every
          seed, which is a balance/AI baseline, not a test failure. The
          assertions therefore accept any decisive outcome and fail only on
          a stalled encounter — except the Test Range, whose steady-state
          stall is exactly what it is for.
      references: [scenarios, test-harness, spawn-director]

  - decision: perf-and-compose-first-consumer
    core:
      status: accepted
      confidence: confirmed
      title: This repo drives vellum-perf and vellum-compose into existence
      summary: >-
        Per the fleet rule that a new shared crate lands only with a driving
        consumer, this repo wires both remaining planned crates. vellum-perf:
        the scenario corpus times every simulated second (sim throughput,
        measured from outside the sim) and compares against a versioned RON
        baseline warnings-first — values are benchmark evidence, and the only
        assertion is that the measurement contract held; live frame sampling
        ships behind the perf-capture feature, writing a capture JSON on
        exit. vellum-compose: ship classes double as a template catalog, and
        the bridge proves value-space composition exactly reproduces the
        typed loader against the real ships.ron — including RON's field: ()
        take-the-defaults idiom, which the bridge's first run caught the
        value layer flattening. The data editor builds on that equivalence
        instead of re-earning it.
      rationale:
        - >-
          vellum-perf's contract is project-phoenix-v2's performance PRD
          (its issue 868) — designed for phoenix, proven here, so phoenix
          implements its workflow on the crate later without this repo ever
          having depended on phoenix code.
      references: [scenarios, data-tuning, dev-panel]
