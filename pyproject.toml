[project]
name = "void-and-thunder-tooling"
version = "0.1.0"
description = "Design/architecture tooling for Void & Thunder. The game is Rust; this exists only to run PASM against the spec in pasm/spec."
requires-python = ">=3.11"
dependencies = [
    # PASM: models the intended shape of the codebase and checks the Rust
    # implementation against it, so an agent can't quietly invent a second way
    # of doing something that already exists. See pasm/spec/.
    #
    # The tool lives in the fleet's shared repository (a subdirectory of
    # vellum), pinned to a rev. Bumping the rev is part of a vellum bump PR —
    # see vellum's docs/handbook/bump-workflow.md.
    "pasm @ git+https://github.com/jkeywo/vellum@61cf506e096854a3e05e1a19369deb0901d298d5#subdirectory=pasm",
]

[tool.uv]
# Local checkout override — uncomment for work against a sibling vellum
# checkout, re-comment before committing. The committed state always resolves
# the pinned rev.
# [tool.uv.sources]
# pasm = { path = "../vellum/pasm", editable = true }
