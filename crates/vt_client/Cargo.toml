[package]
name = "vt_client"
description = "Void & Thunder client — Bevy renderer, input and window over the vt_sim simulation. Native + wasm."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# `wav` enables WAV decoding so the native audio backend can play the
# procedurally-generated sound effects (see src/audio.rs).
[dependencies]
bevy = { workspace = true, features = ["wav"] }
vt_sim.workspace = true

# On the web, Bevy's audio is disabled (it doesn't play nicely in wasm); sound is
# routed through a WebAudio JS shim instead, called via wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# Native-only: Ultralight renders the HTML HUD (assets/ui/hud.html) to a pixel
# buffer that we upload to a Bevy texture and composite as a UI node — full
# native perf, proper alpha, no OS-window overlay. Behind `native-html-hud`.
# ul-next downloads the Ultralight SDK at build time; Ultralight is proprietary
# but free for indies under their revenue/funding thresholds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ul-next = { version = "0.5", optional = true }

# Native-only: dynamic linking makes iterative debug builds much faster.
# Enable with `cargo run --features fast-compile`. Never enabled for wasm.
[features]
default = ["native-html-hud"]
fast-compile = ["bevy/dynamic_linking"]
# Render the HTML HUD (assets/ui/hud.html) on native desktop via Ultralight →
# Bevy texture — the canonical HUD, matching the web build. Default-on so
# plain `cargo run -p vt_client` shows a HUD; it downloads/links the Ultralight
# SDK and needs its `resources/` folder at runtime. `ul-next` is a target-
# specific optional dependency (see above), so disabling this feature is a
# no-op on wasm regardless. Opt out with `--no-default-features` if you don't
# want the Ultralight dependency — native then runs with no HUD at all.
native-html-hud = ["dep:ul-next"]
