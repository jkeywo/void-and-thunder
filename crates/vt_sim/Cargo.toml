[package]
name = "vt_sim"
description = "Void & Thunder simulation — ship physics, combat, spawning. Renderer-agnostic, built on Bevy ECS."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Logic-only Bevy: ECS, App/Plugin, math, time, transform. No render/window/audio.
# Deliberately *not* bevy_asset: this crate owns the tuning types and knows how
# to be deserialized, but never loads a file. The client does the loading and
# hands the result over as a plain Resource, so `Harness` stays a bare World.
bevy_app.workspace = true
bevy_ecs.workspace = true
# `serialize` is named explicitly rather than relied on via feature unification
# with the client, so `cargo test -p vt_sim` on its own still gets Vec2: Serialize.
bevy_math = { workspace = true, features = ["serialize", "bevy_reflect"] }
# The design panel walks these structs field by field rather than hard-coding a
# UI per type, so a field added here shows up in the panel without further work.
bevy_reflect.workspace = true
bevy_time.workspace = true
bevy_transform.workspace = true
serde.workspace = true
