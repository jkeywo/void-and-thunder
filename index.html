<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Void &amp; Thunder</title>
    <link data-trunk rel="rust" href="crates/vt_client/Cargo.toml" data-bin="vt_client" data-wasm-opt="s" />
    <!-- Ship the client's runtime assets (skybox, shaders, ship models) into the
         web build so the wasm app can load them from `assets/`. -->
    <link data-trunk rel="copy-dir" href="crates/vt_client/assets" data-target-path="assets" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #05050c;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        color: #7a7ab0;
        font: 500 1rem/1.5 system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-align: center;
      }
      /* Fullscreen toggle, floating in the top-right of the HTML layer above the
         canvas. Purely a browser convenience — the wasm app never sees it. */
      #fullscreen {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
        width: 34px;
        height: 34px;
        padding: 0;
        display: grid;
        place-content: center;
        border: 1px solid #3a3a5c;
        border-radius: 6px;
        background: rgba(12, 12, 24, 0.55);
        color: #b8b8e0;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        backdrop-filter: blur(2px);
      }
      #fullscreen:hover {
        background: rgba(24, 24, 44, 0.8);
        color: #fff;
      }
    </style>
    <script>
      // WebAudio sound-effect shim for the wasm build. Bevy audio is disabled on
      // the web; the game calls window.vtPlaySound(name) via wasm-bindgen.
      (function () {
        let ctx;
        function audioCtx() {
          if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
          return ctx;
        }
        // Browsers block audio until a user gesture — resume on first input.
        for (const ev of ['keydown', 'pointerdown']) {
          window.addEventListener(ev, audioCtx);
        }
        function env(gain, t0, dur, peak) {
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        }
        function noise(c, dur) {
          const n = Math.floor(c.sampleRate * dur);
          const buf = c.createBuffer(1, n, c.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
          const src = c.createBufferSource();
          src.buffer = buf;
          return src;
        }
        // pitch scales every frequency and shortens the sound; gain scales the
        // whole thing. Both come from Rust so the web and native builds make the
        // same variation decisions — only the synthesis differs.
        window.vtPlaySound = function (name, pitch, gain) {
          const c = audioCtx();
          const t = c.currentTime;
          const p = (typeof pitch === 'number' && pitch > 0) ? pitch : 1;
          const v = (typeof gain === 'number' && gain >= 0) ? gain : 1;
          if (v <= 0.001) return;
          // Everything is mixed through one gain node so `v` needs applying once.
          const out = c.createGain();
          out.gain.value = v;
          out.connect(c.destination);
          const dur = (s) => s / p;   // a higher pitch is a shorter sound
          if (name === 'hit') {
            const o = c.createOscillator();
            o.type = 'square';
            o.frequency.value = 760 * p;
            const g = c.createGain();
            env(g, t, dur(0.08), 0.12);
            o.connect(g).connect(out);
            o.start(t); o.stop(t + dur(0.09));
          } else if (name === 'broadside') {
            const src = noise(c, dur(0.28));
            const f = c.createBiquadFilter();
            f.type = 'lowpass'; f.frequency.value = 500 * p;
            const g = c.createGain();
            env(g, t, dur(0.28), 0.3);
            src.connect(f).connect(g).connect(out);
            src.start(t);
            const o = c.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(120 * p, t);
            o.frequency.exponentialRampToValueAtTime(50 * p, t + dur(0.22));
            const g2 = c.createGain();
            env(g2, t, dur(0.22), 0.35);
            o.connect(g2).connect(out);
            o.start(t); o.stop(t + dur(0.24));
          } else if (name === 'explosion') {
            const src = noise(c, dur(0.5));
            const f = c.createBiquadFilter();
            f.type = 'lowpass';
            f.frequency.setValueAtTime(1400 * p, t);
            f.frequency.exponentialRampToValueAtTime(200 * p, t + dur(0.4));
            const g = c.createGain();
            env(g, t, dur(0.5), 0.45);
            src.connect(f).connect(g).connect(out);
            src.start(t);
          } else if (name === 'board') {
            [523, 784].forEach((freq, i) => {
              const o = c.createOscillator();
              o.type = 'triangle';
              o.frequency.value = freq * p;
              const g = c.createGain();
              const tt = t + i * dur(0.12);
              env(g, tt, dur(0.18), 0.22);
              o.connect(g).connect(out);
              o.start(tt); o.stop(tt + dur(0.2));
            });
          } else if (name === 'boost') {
            // Noise swept up through an opening filter: the drive spooling up.
            const d = dur(0.45);
            const src = noise(c, d);
            const f = c.createBiquadFilter();
            f.type = 'lowpass';
            f.frequency.setValueAtTime(200 * p, t);
            f.frequency.exponentialRampToValueAtTime(2200 * p, t + d);
            const g = c.createGain();
            env(g, t, d, 0.3);
            src.connect(f).connect(g).connect(out);
            src.start(t);
            const o = c.createOscillator();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(90 * p, t);
            o.frequency.exponentialRampToValueAtTime(350 * p, t + d);
            const g2 = c.createGain();
            env(g2, t, d, 0.14);
            o.connect(g2).connect(out);
            o.start(t); o.stop(t + d);
          } else if (name === 'warp') {
            // Falling pitch: departure.
            const d = dur(0.38);
            const o = c.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(960 * p, t);
            o.frequency.exponentialRampToValueAtTime(80 * p, t + d);
            const g = c.createGain();
            env(g, t, d, 0.3);
            o.connect(g).connect(out);
            o.start(t); o.stop(t + d);
            const src = noise(c, dur(0.04));
            const g2 = c.createGain();
            env(g2, t, dur(0.04), 0.2);
            src.connect(g2).connect(out);
            src.start(t);
          } else if (name === 'brace') {
            // Two detuned partials beating: shutters coming down.
            [320, 487].forEach((freq, i) => {
              const o = c.createOscillator();
              o.type = 'triangle';
              o.frequency.value = freq * p;
              const g = c.createGain();
              env(g, t, dur(0.2), i === 0 ? 0.22 : 0.15);
              o.connect(g).connect(out);
              o.start(t); o.stop(t + dur(0.22));
            });
          } else if (name === 'hullwarn') {
            // Low, dull, two pulses. It repeats, so it must not grate.
            [0, 0.15].forEach((off) => {
              const o = c.createOscillator();
              o.type = 'sine';
              o.frequency.value = 196 * p;
              const g = c.createGain();
              const tt = t + dur(off);
              env(g, tt, dur(0.12), 0.16);
              o.connect(g).connect(out);
              o.start(tt); o.stop(tt + dur(0.13));
            });
          }
        };
      })();
    </script>
    <script>
      // HUD overlay shim for the wasm build. The game's HudBridgePlugin builds a
      // JSON snapshot of the player ship each frame and pushes it here via
      // wasm-bindgen. The HUD is the self-contained page assets/ui/hud.html; we
      // inject its <style> + body into a same-document overlay <div> (NOT an
      // iframe — a transparent iframe over a WebGL canvas composites with an
      // opaque backing in Chromium and hides the game). bridge.js exposes
      // __applyHud. See crates/vt_client/src/hud.rs.
      (function () {
        const BASE = 'assets/ui/';
        window.vtHudInit = function () {
          if (document.getElementById('vt-hud-overlay')) return;
          const overlay = document.createElement('div');
          overlay.id = 'vt-hud-overlay';
          // Same-document, transparent, click-through, above the canvas.
          overlay.style.cssText =
            'position:fixed;inset:0;z-index:5;pointer-events:none;background:transparent;';
          document.body.appendChild(overlay);

          fetch(BASE + 'hud.html')
            .then((r) => r.text())
            .then((html) => {
              const doc = new DOMParser().parseFromString(html, 'text/html');
              // Scoped-ish styles into <head> (hud.html selectors are namespaced
              // under #hud/.panel; the html,body rule only sets transparent).
              doc.querySelectorAll('style').forEach((s) =>
                document.head.appendChild(s.cloneNode(true))
              );
              // Body content (minus scripts) into the overlay.
              Array.from(doc.body.children).forEach((el) => {
                if (el.tagName !== 'SCRIPT') overlay.appendChild(el.cloneNode(true));
              });
              // Load bridge.js (sets __hosted + __applyHud), then run hud.html's
              // inline script (defines updateHud, boot). Both run in THIS window,
              // so their document.getElementById calls resolve the injected nodes.
              const bridge = document.createElement('script');
              bridge.src = BASE + 'bridge.js';
              bridge.onload = () => {
                doc.body.querySelectorAll('script:not([src])').forEach((orig) => {
                  const s = document.createElement('script');
                  s.textContent = orig.textContent;
                  document.body.appendChild(s);
                });
              };
              document.head.appendChild(bridge);
            });
        };
        window.vtHudApply = function (json) {
          if (typeof window.__applyHud === 'function') window.__applyHud(json);
        };
        // The string table, handed over by the client. The overlay's own
        // script defines the real vtStrings when it loads; until then hold
        // the table so nothing is lost to the race.
        var pendingStrings = null;
        window.vtStrings = function (json) {
          if (typeof window.__applyStrings === 'function') window.__applyStrings(json);
          else pendingStrings = json;
        };
        window.vtStringsDrain = function () {
          if (pendingStrings !== null && typeof window.__applyStrings === 'function') {
            window.__applyStrings(pendingStrings);
            pendingStrings = null;
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="loading">Crossing the void&hellip;<br /><small>loading Void &amp; Thunder</small></div>
    <button id="fullscreen" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
    <script>
      // Fullscreen toggle. Requests fullscreen on the whole document so the
      // canvas fills the display; the glyph flips to a "collapse" mark while in.
      (function () {
        const btn = document.getElementById('fullscreen');
        function sync() {
          const on = !!document.fullscreenElement;
          btn.textContent = on ? '✖' : '⛶';
          btn.title = on ? 'Exit fullscreen' : 'Toggle fullscreen';
        }
        btn.addEventListener('click', function () {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            document.documentElement.requestFullscreen().catch(function () {});
          }
        });
        document.addEventListener('fullscreenchange', sync);
        sync();
      })();
    </script>
    <script type="module">
      // Hide the loader once the wasm app has attached its canvas.
      const obs = new MutationObserver(() => {
        if (document.querySelector('canvas')) {
          const l = document.getElementById('loading');
          if (l) l.remove();
          obs.disconnect();
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
